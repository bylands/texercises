<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Graphs</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="generator.js"></script>
  <script defer src="plot.js"></script>
  <script defer src="editor.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Motion Graphs</h1>
      <p id="score" class="score"></p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div id="tasks" class="levels" role="radiogroup" aria-label="Kind of exercise"></div>
      <button id="new" type="button" class="primary">New exercise</button>
    </div>

    <section class="card">
      <h2 id="task-title"></h2>
      <p id="statement"></p>

      <h3 id="given-title"></h3>
      <div id="given" class="plot"></div>

      <h3 id="draw-title"></h3>
      <div class="plot draw-wrap">
        <svg id="draw" tabindex="0" role="application"></svg>
      </div>
      <p id="howto" class="note"></p>

      <div class="actions">
        <button type="button" id="check" class="primary">Check</button>
        <button type="button" id="hint" class="secondary">Hint</button>
        <button type="button" id="reset" class="secondary">Reset drawing</button>
        <button type="button" id="reveal" class="secondary">Show solution</button>
      </div>
      <p id="reveal-note" class="note">The solution unlocks once you have solved the exercise, used all hints or made three attempts.</p>
      <p id="status" class="status" aria-live="polite"></p>
      <ul id="feedback" class="feedback"></ul>
    </section>

    <section id="hints" class="card" hidden>
      <h3>Hints</h3>
      <ol id="hint-list"></ol>
    </section>

    <section id="solution" class="card" hidden>
      <h3>Solution</h3>
      <div id="sol-text"></div>
    </section>
  </main>
</body>
</html>

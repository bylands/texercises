<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resistor Circuit Trainer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script defer src="circuit.js"></script>
  <script defer src="generator.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Resistor Circuit Trainer</h1>
      <p id="score" class="score"></p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div id="levels" class="levels" role="radiogroup" aria-label="Difficulty"></div>
      <button id="new" type="button" class="primary">New exercise</button>
    </div>

    <section id="task" class="card">
      <h2 id="title"></h2>
      <p id="prompt"></p>
      <div id="figure" class="figs"></div>

      <form id="answers" novalidate>
        <div id="fields"></div>
        <div class="actions">
          <button type="submit" class="primary">Check</button>
          <button type="button" id="hint" class="secondary">Hint</button>
          <button type="button" id="reveal" class="secondary">Show solution</button>
        </div>
        <p id="reveal-note" class="note">The worked solution unlocks once you have solved the exercise, used all hints or made three attempts.</p>
        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="hints" class="card" hidden>
      <h3>Hints</h3>
      <ol id="hint-list"></ol>
    </section>

    <section id="solution" class="card" hidden>
      <h3>Solution</h3>
      <p class="note">The diagram shows all currents (<span class="c-cur">blue</span>) and voltages (<span class="c-vol">red</span>) in the circuit.</p>
      <div id="sol-figure" class="figs"></div>
      <div id="sol-steps" class="steps"></div>
      <p id="sol-short" class="short"></p>
    </section>
  </main>
</body>
</html>
